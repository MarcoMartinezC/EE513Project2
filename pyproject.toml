[project]
name = "isp-from-raw"
version = "0.1.0"
description = "EE513 Project 2: a raw-to-RGB image signal processor with classical and learned denoising"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-contrib-python>=4.8",
    "rawpy>=0.19",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

# If the course gave you its own pyproject.toml, merge these groups into it
# instead of replacing it. Install with:  uv sync --group learning
[dependency-groups]
learning = [
    "torch>=2.2",
    "torchvision>=0.17",
    "onnx>=1.15",
    "onnxscript>=0.1",
    "onnxruntime>=1.17",
    "torchmetrics[image]>=1.3",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:torch.*", "ignore::DeprecationWarning"]
