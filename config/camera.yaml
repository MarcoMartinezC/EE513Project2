# Calibration constants for the camera characterised in Project 1.
# Every measured value is [value, uncertainty]. null = not filled in yet.
# Paths are relative to `root`, which is relative to this file.
root: ..

camera:
  make: Nikon
  model: Z 50
  lens: NIKKOR Z DX 16-50mm f/3.5-6.3 VR
  focal_length_mm: null  # choose for the capture session (P1: geometry/edges 50, flats 26, darks 30, colour 16)
  aperture_f: null

raw:
  black_level_dn: [1008.26, 0.01]   # P1 dark frames, extrapolated to 0 s (file: 1008)
  white_level_dn: [16383, 0]   # confirmed: DSC_1485 (ISO 100, 1 s) clips at exactly 16383 across the centre

paths:
  dark_frames: data/calib/dark     # one ISO and exposure per folder; new captures
  flat_frames: data/calib/flat     # NEW evenly lit flat at the chosen zoom/aperture
  bursts: data/burst               # one sub-folder per ISO, named like iso100, iso800, iso3200
  detail: data/detail
  detector: data/detector
  derived: data/derived
  results: results

calibration:
  defects_k_sigma: 8.0
  stuck_tolerance: 0.3
  lsc_method: poly
  lsc_degree: 6
  lsc_sigma_frac: 0.01

white_balance:
  # Daylight (overcast), white paper in the burst scene: DSC_2136-2155 (ISO 100, 1 s), box rows 500-750,
  # cols 1500-1750, shading-corrected; mean of 20 frames, uncertainty = half-spread over frames.
  # Paper neutrality not verified (optical brighteners would bias B slightly).
  gains_rgb: [[2.3091, 0.0012], [1.0, 0.0], [1.5225, 0.0011]]

color_correction:
  # Project 1 Natural light round (DSC_1420-1422, ISO 400, 16 mm): camera RGB -> XYZ (D50) per chart,
  # Bradford D50 -> D65, XYZ -> linear sRGB, each divided by its G-row sum (~100), mean of 3 charts.
  # Fit quality on those charts: mean dE00 2.43 ± 0.12, worst 5.67 ± 0.17. Applied as rgb @ M.T.
  matrix:
    - [ 1.6485, -0.4997, -0.1902]
    - [-0.1731,  1.7019, -0.5288]
    - [ 0.0275, -0.5290,  1.4935]
  uncertainty:   # half-spread across charts A-C
    - [0.0251, 0.0081, 0.0100]
    - [0.0056, 0.0235, 0.0182]
    - [0.0045, 0.0229, 0.0220]

noise:
  # Poisson-Gaussian model in raw DN: var = mean / K + read^2, K in electrons per DN.
  # scripts/fit_ptc.py --max-level 0.3: flat pairs DSC_1494-1570 (overcast sky, defocused),
  # dark pairs DSC_1601-1642. Fixed fit (weighted, intercept = dark-pair read noise^2).
  iso:
    100:
      gain_e_per_dn: [3.078, 0.041]    # planes + spread of ols/weighted/fixed (3.08-3.14)
      read_noise_dn: [1.358, 0.023]    # dark pairs, 1/4000 s
    800:
      gain_e_per_dn: [0.399, 0.013]    # fits agree within 0.2 %
      read_noise_dn: [3.351, 0.008]
    3200:
      gain_e_per_dn: [0.1004, 0.0029]  # fits agree within 0.7 %; 2 clipped pairs excluded
      read_noise_dn: [11.563, 0.067]